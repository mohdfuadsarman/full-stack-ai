<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task 3</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f4f7fa;
            margin: 0;
            padding: 20px;
            display: flex;
            align-items: center;
            height: auto;
            min-height: 100%;
            flex-direction: column;
        }

        #root {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        p {
            color: #666;
            margin: 10px 0;
        }

        .button-wrapper {
            margin: 20px 0;
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }

        .summary-card {
            background-color: #e9ecef;
            border-radius: 8px;
            padding: 15px;
            margin-top: 20px;
            text-align: left;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-top: 10px;
        }

        .summary-row div {
            flex: 1;
            padding: 5px;
        }

        .submission-timestamps {
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        // (a) Define a functional React component
        function AssignmentPageComponent() {
            const [submitCount, setSubmitCount] = useState(0);
            const [started, setStarted] = useState(false);
            const [submissionTimestamps, setSubmissionTimestamps] = useState([]);
            const dueDate = new Date();
            dueDate.setDate(dueDate.getDate() + 7); // Set due date to 1 week from now

            const handleAssignmentClick = () => {
                if (!started) {
                    setStarted(true);
                } else {
                    const timestamp = new Date().toLocaleString();
                    setSubmitCount((prev) => prev + 1);
                    setSubmissionTimestamps((prev) => [...prev, timestamp]);
                }
            };

            return (
                <div>
                    <h1>Assignment Portal</h1>
                    <p>{started ? "You have started the assignment." : "You have not started the assignment yet."}</p>
                    <p>You can submit your assignment multiple times, but only the last submission will be considered.</p>
                    <AssignmentButton started={started} onClick={handleAssignmentClick} />
                    <SubmissionSummary
                        dueDate={dueDate}
                        count={submitCount}
                        questions={5}
                        totalMarks={100}
                        timestamps={submissionTimestamps}
                    />
                </div>
            );
        }

        function AssignmentButton({ started, onClick }) {
            return (
                <div className="button-wrapper">
                    <button onClick={onClick}>
                        {started ? "Submit Assignment" : "Start Assignment"}
                    </button>
                </div>
            );
        }

        function SubmissionSummary({ dueDate, count, questions, totalMarks, timestamps }) {
            const formattedDate =
                dueDate instanceof Date
                    ? dueDate.toLocaleDateString(undefined, {
                        weekday: "long",
                        year: "numeric",
                        month: "long",
                        day: "numeric",
                    })
                    : dueDate;

            return (
                <div className="summary-card">
                    <h3>Assignment Summary</h3>
                    <div className="summary-row">
                        <div><strong>Due Date:</strong><br />{formattedDate}</div>
                        <div><strong>Submissions:</strong><br />{count}</div>
                        <div><strong>Questions:</strong><br />{questions}</div>
                        <div><strong>Total Marks:</strong><br />{totalMarks}</div>
                    </div>
                    <div className="submission-timestamps">
                        <strong>Submission Timestamps:</strong>
                        {timestamps.length > 0 ? (
                            <ul>
                                {timestamps.map((timestamp, index) => (
                                    <li key={index}>{timestamp}</li>
                                ))}
                            </ul>
                        ) : (
                            <p>No submissions yet.</p>
                        )}
                    </div>
                </div>
            );
        }

        // (b) Render the component using ReactDOM.render() to display it on the page
        ReactDOM.render(<AssignmentPageComponent />, document.getElementById("root"));
    </script>
</body>
</html>
